<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WA DIRECT!!!</title>

  <!-- Tailwind + Icon -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#25D366" />
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white shadow-lg rounded-2xl p-6 w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
      <i class="fa-brands fa-whatsapp text-green-500"></i> Wa Direct
    </h1>

    <!-- Nomor + Flag -->
    <label class="block mb-2 text-sm font-medium text-gray-700">Nomor WhatsApp</label>
    <div class="flex items-center border rounded-xl overflow-hidden mb-4">
      <span id="flag" class="px-3 text-lg select-none">🌐</span>
      <span class="bg-gray-200 px-2 text-gray-600 select-none">+ </span>
      <input
        type="tel"
        id="phone"
        inputmode="numeric"
        pattern="[0-9]*"
        class="flex-1 p-3 outline-none"
        placeholder="628123456789"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        required
      />
    </div>

    <!-- Pesan -->
    <label class="block mb-2 text-sm font-medium text-gray-700">Pesan</label>
    <textarea
      id="message"
      rows="3"
      class="w-full border rounded-xl p-3 mb-4 outline-none"
      placeholder="Halo, saya ingin bertanya..."
    ></textarea>

    <!-- Jenis WA (Radio) -->
    <label class="block mb-2 text-sm font-medium text-gray-700">Buka dengan</label>
    <div class="flex items-center gap-4 mb-5">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="waType" value="original" checked />
        <span>WA Original</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="waType" value="business" />
        <span>WA Business</span>
      </label>
    </div>

    <!-- Actions -->
    <button
      id="sendBtn"
      class="w-full bg-green-500 text-white py-3 rounded-xl font-medium hover:bg-green-600 transition flex items-center justify-center gap-2"
    >
      <i class="fa-brands fa-whatsapp"></i> Kirim Pesan
    </button>

    <p id="debug" class="text-xs text-gray-400 mt-3 select-text"></p>
  </div>

  <!-- App JS dengan versi untuk bust cache -->
  <script>
    const v = '20250815'; // bump kalau update
    const s = document.createElement('script');
    s.src = `app.js?v=${v}`;
    document.body.appendChild(s);
  </script>

  <!-- SW register dengan versi -->
  <script>
    if ('serviceWorker' in navigator) {
      const swv = 'v3';
      navigator.serviceWorker.register(`sw.js?v=${swv}`).then(() => {
        console.log('SW registered', swv);
      });
    }
  </script>
</body>
</html>
